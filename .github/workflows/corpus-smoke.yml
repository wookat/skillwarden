name: Corpus smoke

# Weekly non-gating scan of real public skill repositories to catch
# false-positive regressions and discovery breakage early. Findings do not
# fail the run (exit 1 is expected on corpora with findings); only usage or
# environment errors (exit 2) fail it.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scan public corpora
        run: |
          set -uo pipefail
          mkdir -p corpus-reports
          for repo in anthropics/skills obra/superpowers wshobson/agents; do
            name=$(echo "$repo" | tr '/' '-')
            git clone --quiet --depth 1 "https://github.com/$repo.git" "/tmp/$name"
            start=$(date +%s%N)
            (cd "/tmp/$name" && node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" scan --format json -o "$GITHUB_WORKSPACE/corpus-reports/$name.json")
            code=$?
            elapsed_ms=$(( ($(date +%s%N) - start) / 1000000 ))
            if [ "$code" -ge 2 ]; then
              echo "::error::scan of $repo failed with exit $code" && exit 1
            fi
            count=$(node -e "const r=require('$GITHUB_WORKSPACE/corpus-reports/$name.json');console.log(r.length+' skills, '+r.reduce((a,s)=>a+s.findings.length,0)+' findings')")
            echo "$repo: $count in ${elapsed_ms}ms (exit $code)" | tee -a corpus-reports/summary.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-reports
          path: corpus-reports/
