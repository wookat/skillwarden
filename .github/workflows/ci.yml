name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        exclude:
          - os: ubuntu-latest # covered by the main ci job
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Dogfood — scan the example skills
        shell: bash
        run: |
          node packages/cli/dist/index.js scan examples/skills/benign-skill && \
          if node packages/cli/dist/index.js scan examples/skills/malicious-skill; then
            echo "expected malicious example to fail the gate" && exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Core coverage gate (≥90% stmts/lines, ≥85% funcs, ≥75% branches)
        run: pnpm --filter skillwarden-core test:coverage
      - name: Validate advisories against schema
        run: node scripts/validate-advisories.mjs
      - name: Dogfood — scan the example skills
        run: |
          node packages/cli/dist/index.js scan examples/skills/benign-skill && \
          if node packages/cli/dist/index.js scan examples/skills/malicious-skill; then
            echo "expected malicious example to fail the gate" && exit 1
          fi
      - name: Dogfood — lock/diff round-trip on examples
        run: |
          node packages/cli/dist/index.js lock examples/skills/benign-skill
          node packages/cli/dist/index.js diff examples/skills/benign-skill
      - name: E2E — install packed tarballs and run the full gate chain
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          pnpm --filter skillwarden-core --filter skillwarden exec pnpm pack --pack-destination "$workdir"
          mkdir "$workdir/app" && cd "$workdir/app" && npm init -y >/dev/null
          npm install "$workdir"/skillwarden-core-*.tgz "$workdir"/skillwarden-0*.tgz
          cp -r "$GITHUB_WORKSPACE/examples/skills/benign-skill" .
          npx skillwarden --version
          npx skillwarden scan benign-skill
          npx skillwarden lock benign-skill
          npx skillwarden diff benign-skill
          npx skillwarden ci benign-skill
          echo 'tampered' >> benign-skill/SKILL.md
          if npx skillwarden ci benign-skill; then
            echo 'expected drift to fail the gate' && exit 1
          fi
